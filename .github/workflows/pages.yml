name: Publish single-file game to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [index.html, .github/workflows/pages.yml]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage only the distributable
        run: |
          mkdir -p "$RUNNER_TEMP/exit-north-site"
          cp index.html "$RUNNER_TEMP/exit-north-site/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/exit-north-site
      - uses: actions/deploy-pages@v4
        id: deployment
